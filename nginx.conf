# ============================================================
# Roteamento por SUBPASTA (um único host, sem domínios)
#   /                -> landing (React SPA)
#   /sistema-gestao/ -> /usr/share/nginx/html/sistema-gestao
#   /proposta/       -> /usr/share/nginx/html/proposta
# ============================================================
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ---- Sistema de gestão ( ^~ = tem prioridade sobre as regex abaixo ) ----
    location = /sistema-gestao { return 308 /sistema-gestao/; }
    location ^~ /sistema-gestao/ {
        try_files $uri $uri/ /sistema-gestao/index.html;
    }

    # ---- Proposta ----
    location = /proposta { return 308 /proposta/; }
    location ^~ /proposta/ {
        try_files $uri $uri/ /proposta/index.html;
    }

    # ---- Assets da landing (JS/CSS com hash + imagens) ----
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ---- Landing (SPA): qualquer outra rota cai no index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML e config em runtime nunca cacheiam (refletem novas versões na hora)
    location ~* \.html$ { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /config.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; }

    # Segurança básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
