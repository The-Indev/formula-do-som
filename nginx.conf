# ============================================================
# Roteamento por SUBDOMÍNIO (um único container)
#   gestao.*   -> /usr/share/nginx/html/gestao
#   proposta.* -> /usr/share/nginx/html/proposta
#   (qualquer outro host, incl. domínio raiz e www) -> landing
# As regex casam só o PREFIXO do subdomínio, então valem para
# qualquer domínio base anexado no Easypanel.
# ============================================================

# ---- Sistema de gestão: gestao.<qualquer-dominio> ----
server {
    listen 80;
    server_name ~^gestao\.;
    root /usr/share/nginx/html/gestao;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location / { try_files $uri $uri/ =404; }
    location ~* \.html$ { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location ~* \.(css|js|jpg|jpeg|png|svg|ico|webp)$ { expires 1h; add_header Cache-Control "public, max-age=3600"; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ---- Proposta: proposta.<qualquer-dominio> ----
server {
    listen 80;
    server_name ~^proposta\.;
    root /usr/share/nginx/html/proposta;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location / { try_files $uri $uri/ =404; }
    location ~* \.html$ { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location ~* \.(css|js|jpg|jpeg|png|svg|ico|webp)$ { expires 1h; add_header Cache-Control "public, max-age=3600"; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ---- Landing (site padrão): domínio raiz, www e qualquer outro host ----
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html/landing;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # SPA (React): qualquer rota cai no index.html
    location / { try_files $uri $uri/ /index.html; }

    # Assets com hash -> cache longo
    location /assets/ { try_files $uri =404; expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; }

    # HTML e config em runtime nunca cacheiam
    location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /config.js  { add_header Cache-Control "no-cache, no-store, must-revalidate"; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
